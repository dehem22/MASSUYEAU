<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&eacute;n&eacute;rateur de Permalien - Archives D&eacute;partementales</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #1a1a1a;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #004085;
        }
        .reset-btn {
            background-color: #6c757d;
        }
        .reset-btn:hover {
            background-color: #5a6268;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
            width: 100%;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        details {
            margin-top: 15px;
            background-color: #eef4fc;
            border: 1px solid #b6d4fe;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9em;
        }
        summary {
            font-weight: bold;
            color: #055160;
            cursor: pointer;
        }
        details ol {
            margin: 10px 0 0 0;
            padding-left: 20px;
            line-height: 1.5;
        }
        details code {
            background-color: #d0e2ff;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>G&eacute;n&eacute;rateur de Permalien - Archives D&eacute;partementales</h2>
    
    <label for="deptSelect">Choix du d&eacute;partement :</label>
    <select id="deptSelect" onchange="changerDepartement()">
        <option value="09">09 - Ari&egrave;ge</option>
        <option value="11">11 - Aude</option>
        <option value="38" selected>38 - Is&egrave;re</option>
        <option value="61">61 - Orne</option>
        <option value="66">66 - Pyr&eacute;n&eacute;es-Orientales</option>
        <option value="75">75 - Paris</option>
        <option value="77">77 - Seine-et-Marne</option>
    </select>

    <!-- Groupe de champs pour les départements standards -->
    <div id="standardGroup">
        <label for="baseUrl">Base de l'URL :</label>
        <input type="text" id="baseUrl" value="http://archivesenligne.archives-isere.fr/mdr/index.php/docnumViewer/afficheUdDocNum/" oninput="genererPermalien()">

        <label for="coteInput">Cote du document :</label>
        <input type="text" id="coteInput" placeholder="Ex: 9NUM/5E12/7" oninput="genererPermalien()">

        <div id="fichierGroup" style="display: none;">
            <label for="fichierInput">Nom de l'image / fichier :</label>
            <input type="text" id="fichierInput" placeholder="Ex: AD09_4E_4348_0075.jpg" oninput="genererPermalien()">
        </div>
    </div>

    <!-- Groupe de champ spécifique à Paris -->
    <div id="parisGroup" style="display: none;">
        <label for="urlInput">URL longue issue de la recherche (Paris) :</label>
        <input type="text" id="urlInput" placeholder="Collez l'URL compl&egrave;te ici..." oninput="genererPermalien()">
    </div>

    <!-- Numéro de page/vue (Commun) -->
    <div id="pageGroup">
        <label for="pageInput">N&deg; de la vue / page d&eacute;sir&eacute;e :</label>
        <input type="number" id="pageInput" placeholder="Ex: 75" min="1" oninput="genererPermalien()">
    </div>

    <details open>
        <summary>Comment utiliser le g&eacute;n&eacute;rateur ?</summary>
        <ol id="instructions">
            <li>S&eacute;lectionnez le d&eacute;partement souhait&eacute;.</li>
            <li>Saisissez la cote du registre.</li>
            <li>Indiquez le num&eacute;ro de vue souhait&eacute;.</li>
        </ol>
    </details>

    <div class="btn-group">
        <button type="button" onclick="genererPermalien()">G&eacute;n&eacute;rer le permalien</button>
        <button type="button" class="reset-btn" onclick="reinitialiser()">Effacer</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="resultContainer" style="display: none;">
        <label>Permalien g&eacute;n&eacute;r&eacute; :</label>
        <div id="resultUrl" class="result-box"></div>
        <button type="button" id="copyBtn" class="copy-btn" onclick="copierUrl()">Copier le lien</button>
    </div>
</div>

<script>
const deptsConfig = {
    "09": {
        baseUrl: "https://mdr-archives.ariege.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 1NUM/4E4348",
        placeholderFichier: "Ex: AD09_4E_4348_0075.jpg"
    },
    "11": {
        baseUrl: "https://mdr.aude.fr/mdr_aude/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 100NUM/5E3/10",
        placeholderFichier: "Ex: AD11_5E003_010_075.JPG"
    },
    "38": {
        baseUrl: "http://archivesenligne.archives-isere.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "numDocument",
        placeholderCote: "Ex: 9NUM/5E12/7"
    },
    "61": {
        baseUrl: "https://gaia.orne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "numDocument",
        placeholderCote: "Ex: 3NUMECEC12F>2_001_408"
    },
    "66": {
        baseUrl: "https://archives.cd66.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "numDocument",
        placeholderCote: "Ex: 9NUM2E2901"
    },
    "75": {
        baseUrl: "https://archives.paris.fr/archives-numerisees/etat-civil-de-paris/etat-civil-a-partir-de-1860/consulter-les-actes-detat-civil",
        mode: "paris"
    },
    "77": {
        baseUrl: "https://archives-en-ligne.seine-et-marne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 6e91/13",
        placeholderFichier: "Ex: frad077_6e0091_013_075.jpg"
    }
};

function changerDepartement() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const standardGroup = document.getElementById('standardGroup');
    const parisGroup = document.getElementById('parisGroup');
    const fichierGroup = document.getElementById('fichierGroup');
    const pageGroup = document.getElementById('pageGroup');
    const instructions = document.getElementById('instructions');

    if (config.mode === "paris") {
        standardGroup.style.display = "none";
        parisGroup.style.display = "block";
        fichierGroup.style.display = "none";
        pageGroup.style.display = "block";
        instructions.innerHTML = `
            <li>S&eacute;lectionnez Paris (75).</li>
            <li>Collez l'URL longue issue de votre recherche.</li>
            <li>Indiquez le num&eacute;ro de vue / page d&eacute;sir&eacute;e.</li>
        `;
    } else if (config.mode === "fichier") {
        standardGroup.style.display = "block";
        parisGroup.style.display = "none";
        fichierGroup.style.display = "block";
        pageGroup.style.display = "none";
        document.getElementById('baseUrl').value = config.baseUrl;
        document.getElementById('coteInput').placeholder = config.placeholderCote;
        document.getElementById('fichierInput').placeholder = config.placeholderFichier;
        instructions.innerHTML = `
            <li>S&eacute;lectionnez le d&eacute;partement souhait&eacute;.</li>
            <li>Saisissez la cote du registre.</li>
            <li>Renseignez le nom complet de l'image (fichier).</li>
        `;
    } else {
        standardGroup.style.display = "block";
        parisGroup.style.display = "none";
        fichierGroup.style.display = "none";
        pageGroup.style.display = "block";
        document.getElementById('baseUrl').value = config.baseUrl;
        document.getElementById('coteInput').placeholder = config.placeholderCote;
        instructions.innerHTML = `
            <li>S&eacute;lectionnez le d&eacute;partement souhait&eacute;.</li>
            <li>Saisissez la cote du registre.</li>
            <li>Indiquez le num&eacute;ro de vue d&eacute;sir&eacute;.</li>
        `;
    }
    
    genererPermalien();
}

function genererPermalien() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');

    errorMsg.innerText = "";
    resultContainer.style.display = "none";
    copyBtn.innerText = "Copier le lien";

    let urlFinale = "";

    if (config.mode === "paris") {
        const urlInput = document.getElementById('urlInput').value.trim();
        const pageCible = parseInt(document.getElementById('pageInput').value, 10);

        if (!urlInput) return;

        if (isNaN(pageCible) || pageCible < 1) {
            errorMsg.innerText = "Veuillez entrer un num\u00e9ro de page valide.";
            return;
        }

        const regex = /(\/_recherche-api\/visionneuse-infos\/[^\/]+\/[^\/]+\/[^\/]+\/image\/\d+)/;
        const match = urlInput.match(regex);

        if (!match) {
            errorMsg.innerText = "URL invalide ou fragment de visionneuse introuvable.";
            return;
        }

        const baseVisionneuse = match[1];
        const indexPage = pageCible - 1;

        if (indexPage === 0) {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}`;
        } else {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}/${indexPage}`;
        }

    } else {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const coteRaw = document.getElementById('coteInput').value.trim();

        if (!coteRaw) return;

        if (config.mode === "fichier") {
            let fichierRaw = document.getElementById('fichierInput').value.trim();
            fichierRaw = fichierRaw.replace(/^Image:\s*/i, '').trim();

            if (!fichierRaw) return;
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&fichier=${encodeURIComponent(fichierRaw)}`;
        } else {
            let pageNum = parseInt(document.getElementById('pageInput').value, 10);
            if (isNaN(pageNum) || pageNum < 1) {
                errorMsg.innerText = "Veuillez entrer un num\u00e9ro de vue valide.";
                return;
            }
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&numDocument=${pageNum}`;
        }
    }

    resultUrl.innerText = urlFinale;
    resultContainer.style.display = "block";
}

function copierUrl() {
    const textToCopy = document.getElementById('resultUrl').innerText;
    const copyBtn = document.getElementById('copyBtn');

    navigator.clipboard.writeText(textToCopy).then(() => {
        copyBtn.innerText = "Copi\u00e9 !";
        setTimeout(() => {
            copyBtn.innerText = "Copier le lien";
        }, 2000);
    });
}

function reinitialiser() {
    document.getElementById('coteInput').value = "";
    document.getElementById('fichierInput').value = "";
    document.getElementById('urlInput').value = "";
    document.getElementById('pageInput').value = "";
    document.getElementById('errorMsg').innerText = "";
    document.getElementById('resultContainer').style.display = "none";
}

// Initialisation au chargement avec prise en compte du paramètre ?dept=XX dans l'URL
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const deptParam = urlParams.get('dept');

    if (deptParam && deptsConfig[deptParam]) {
        document.getElementById('deptSelect').value = deptParam;
    }

    changerDepartement();
};
</script>

</body>
</html>
